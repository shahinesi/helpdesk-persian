name: Persian clean Docker build

on:
  push:
    branches: [custom/develop-fa]
    paths:
      - "desk/**"
      - "helpdesk/**"
      - "pyproject.toml"
      - "docker/HelpdeskPersian.Containerfile"
      - "docker/entrypoint.sh"
      - "docker/start.sh"
      - "docker/frappe-docker-source.ref"
      - "desk/patches/*.ref"
      - ".dockerignore"
      - ".github/workflows/persian-docker-build.yml"
  pull_request:
    branches: [custom/develop-fa]
    paths:
      - "desk/**"
      - "helpdesk/**"
      - "pyproject.toml"
      - "docker/HelpdeskPersian.Containerfile"
      - "docker/entrypoint.sh"
      - "docker/start.sh"
      - "docker/frappe-docker-source.ref"
      - "desk/patches/*.ref"
      - ".dockerignore"
      - ".github/workflows/persian-docker-build.yml"
  workflow_dispatch:
    inputs:
      frappe_ref:
        description: Frappe Persian PR #11 commit SHA
        required: true
        type: string
        default: 57b937147c2bdef31f46ef6acb4a73c9fc335586
      erpnext_ref:
        description: ERPNext Persian PR #7 commit SHA
        required: true
        type: string
        default: e662c3ffec9b4cc260270920660f5bbd2407c25a
      helpdesk_ref:
        description: Approved Helpdesk Persian candidate commit SHA
        required: true
        type: string
        default: 68b2c85e8dec228f6d061e62e3321a927dfac6a5
      insights_ref:
        description: Insights Persian PR #5 commit SHA
        required: true
        type: string
        default: 339a6078037e19cf29090c184cf8e2f810790e2c
      telephony_ref:
        description: Existing Telephony source commit SHA
        required: true
        type: string
        default: 039cf39f245d6818ead03cf94eea6ce7f9c1e1f7
      frappe_ui_ref:
        description: Frappe UI Persian PR #6 commit SHA
        required: true
        type: string
        default: 4c517f643542d70949bfca02ad72e58c2b59ca88
      publish_approved_candidate:
        description: Confirm publication of the approved private Office Staging candidate
        required: true
        type: choice
        options: ["no", "yes"]
        default: "no"

permissions:
  contents: read

concurrency:
  group: clean-docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and validate candidate refs
        id: candidate
        env:
          FRAPPE_REF: ${{ inputs.frappe_ref || '57b937147c2bdef31f46ef6acb4a73c9fc335586' }}
          ERPNEXT_REF: ${{ inputs.erpnext_ref || 'e662c3ffec9b4cc260270920660f5bbd2407c25a' }}
          HELPDESK_REF: ${{ inputs.helpdesk_ref || github.event.pull_request.head.sha || github.sha }}
          INSIGHTS_REF: ${{ inputs.insights_ref || '339a6078037e19cf29090c184cf8e2f810790e2c' }}
          TELEPHONY_REF: ${{ inputs.telephony_ref || '039cf39f245d6818ead03cf94eea6ce7f9c1e1f7' }}
          FRAPPE_UI_REF: ${{ inputs.frappe_ui_ref || '4c517f643542d70949bfca02ad72e58c2b59ca88' }}
        run: |
          set -euo pipefail
          for ref in "$FRAPPE_REF" "$ERPNEXT_REF" "$HELPDESK_REF" "$INSIGHTS_REF" "$TELEPHONY_REF" "$FRAPPE_UI_REF"; do
            [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid commit SHA: $ref" >&2; exit 1; }
          done
          key="$(printf '%s\n' "$FRAPPE_REF" "$ERPNEXT_REF" "$HELPDESK_REF" "$INSIGHTS_REF" "$TELEPHONY_REF" "$FRAPPE_UI_REF" | sha256sum | cut -c1-16)"
          {
            echo "image_tag=office-staging:integrated-$key"
            echo "frappe_ref=$FRAPPE_REF"
            echo "erpnext_ref=$ERPNEXT_REF"
            echo "helpdesk_ref=$HELPDESK_REF"
            echo "insights_ref=$INSIGHTS_REF"
            echo "telephony_ref=$TELEPHONY_REF"
            echo "frappe_ui_ref=$FRAPPE_UI_REF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/HelpdeskPersian.Containerfile
          push: false
          load: true
          tags: ${{ steps.candidate.outputs.image_tag }}
          build-args: |
            FRAPPE_REF=${{ steps.candidate.outputs.frappe_ref }}
            ERPNEXT_REF=${{ steps.candidate.outputs.erpnext_ref }}
            HELPDESK_REF=${{ steps.candidate.outputs.helpdesk_ref }}
            INSIGHTS_REF=${{ steps.candidate.outputs.insights_ref }}
            TELEPHONY_REF=${{ steps.candidate.outputs.telephony_ref }}
            FRAPPE_UI_REF=${{ steps.candidate.outputs.frappe_ui_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect built application and asset set
        env:
          IMAGE_TAG: ${{ steps.candidate.outputs.image_tag }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint bash "$IMAGE_TAG" -ec '
            root=/home/frappe/frappe-bench
            for app in frappe erpnext helpdesk insights telephony; do
              test -d "$root/apps/$app"
            done
            test -s "$root/assets/assets.json"
            for app in frappe erpnext helpdesk insights; do
              test -d "$root/assets/$app"
              find -L "$root/assets/$app" -type f -size +0c -print -quit | grep -q .
            done
            test -s "$root/candidate-sha-manifest.json"
          '
          docker run --rm --entrypoint cat "$IMAGE_TAG" /home/frappe/frappe-bench/candidate-sha-manifest.json > candidate-sha-manifest.json
          image_id="$(docker image inspect "$IMAGE_TAG" --format '{{.Id}}')"
          jq --arg tag "$IMAGE_TAG" --arg image_id "$image_id" '. + {local_image_tag: $tag, local_image_id: $image_id, pushed: false}' candidate-sha-manifest.json > candidate-build.json
          mv candidate-build.json candidate-sha-manifest.json

      - name: Record Frappe Core security gate
        id: core-security
        env:
          FRAPPE_REF: ${{ steps.candidate.outputs.frappe_ref }}
        run: |
          set -euo pipefail
          conclusion="unavailable"
          response="$(curl --silent --show-error --fail "https://api.github.com/repos/shahinesi/frappe-persian/commits/$FRAPPE_REF/check-runs?per_page=100" || true)"
          if [[ -n "$response" ]]; then
            conclusion="$(jq -r '[.check_runs[] | select(.name == "Vulnerable Dependency Check")] | sort_by(.started_at) | last | .conclusion // "missing"' <<< "$response")"
          fi
          jq --arg security "$conclusion" '. + {frappe_vulnerable_dependency_check: $security, candidate_accepted: false}' candidate-sha-manifest.json > candidate-build.json
          mv candidate-build.json candidate-sha-manifest.json
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo "Frappe Vulnerable Dependency Check: $conclusion" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate acceptance: false (build-only; Staging/browser acceptance is separate)." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate SHA manifest
        uses: actions/upload-artifact@v4
        with:
          name: integrated-candidate-sha-manifest
          path: candidate-sha-manifest.json
          retention-days: 7

      - name: Require the Core security gate for acceptance
        if: always()
        env:
          CONCLUSION: ${{ steps.core-security.outputs.conclusion }}
        run: |
          if [[ "$CONCLUSION" != "success" ]]; then
            echo "Candidate not accepted: Frappe Vulnerable Dependency Check is '$CONCLUSION'." >&2
            exit 1
          fi

  publish-office-staging:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/codex/helpdesk-localization-consumer' &&
      inputs.publish_approved_candidate == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      checks: read
      packages: write
    concurrency:
      group: office-staging-private-image
      cancel-in-progress: false
    env:
      FRAPPE_REF: 57b937147c2bdef31f46ef6acb4a73c9fc335586
      ERPNEXT_REF: e662c3ffec9b4cc260270920660f5bbd2407c25a
      HELPDESK_REF: 68b2c85e8dec228f6d061e62e3321a927dfac6a5
      INSIGHTS_REF: 339a6078037e19cf29090c184cf8e2f810790e2c
      TELEPHONY_REF: 039cf39f245d6818ead03cf94eea6ce7f9c1e1f7
      FRAPPE_UI_REF: 4c517f643542d70949bfca02ad72e58c2b59ca88
      IMAGE_NAME: ghcr.io/shahinesi/office-staging-persian
    steps:
      - name: Verify dispatch ref and immutable candidate allowlist
        id: candidate
        env:
          INPUT_PUBLISH_APPROVAL: ${{ inputs.publish_approved_candidate }}
          INPUT_FRAPPE_REF: ${{ inputs.frappe_ref }}
          INPUT_ERPNEXT_REF: ${{ inputs.erpnext_ref }}
          INPUT_HELPDESK_REF: ${{ inputs.helpdesk_ref }}
          INPUT_INSIGHTS_REF: ${{ inputs.insights_ref }}
          INPUT_TELEPHONY_REF: ${{ inputs.telephony_ref }}
          INPUT_FRAPPE_UI_REF: ${{ inputs.frappe_ui_ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/codex/helpdesk-localization-consumer
          test "$INPUT_PUBLISH_APPROVAL" = yes
          test "$INPUT_FRAPPE_REF" = "$FRAPPE_REF"
          test "$INPUT_ERPNEXT_REF" = "$ERPNEXT_REF"
          test "$INPUT_HELPDESK_REF" = "$HELPDESK_REF"
          test "$INPUT_INSIGHTS_REF" = "$INSIGHTS_REF"
          test "$INPUT_TELEPHONY_REF" = "$TELEPHONY_REF"
          test "$INPUT_FRAPPE_UI_REF" = "$FRAPPE_UI_REF"
          key="$(printf '%s\n' "$FRAPPE_REF" "$ERPNEXT_REF" "$HELPDESK_REF" "$INSIGHTS_REF" "$TELEPHONY_REF" "$FRAPPE_UI_REF" | sha256sum | cut -c1-16)"
          echo "CANDIDATE_KEY=$key" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=integrated-$key" >> "$GITHUB_ENV"
          echo "candidate_key=$key" >> "$GITHUB_OUTPUT"
          echo "image_tag=integrated-$key" >> "$GITHUB_OUTPUT"
          printf 'Approved candidate key: %s\n' "$key" >> "$GITHUB_STEP_SUMMARY"

      - name: Check Frappe Core security result for the exact candidate SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          result="$(gh api "repos/shahinesi/frappe-persian/commits/$FRAPPE_REF/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "Vulnerable Dependency Check")] | sort_by(.started_at) | last | .conclusion // "missing"')"
          test "$result" = success || { echo "Core security check is '$result'; refusing to publish." >&2; exit 1; }
          echo "Frappe Vulnerable Dependency Check: $result" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout the exact Helpdesk candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 68b2c85e8dec228f6d061e62e3321a927dfac6a5
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build candidate image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/HelpdeskPersian.Containerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: office-staging:${{ steps.candidate.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/shahinesi/helpdesk-persian
            org.opencontainers.image.revision=${{ env.HELPDESK_REF }}
            org.opencontainers.image.description=Private Persian Office Staging candidate
          build-args: |
            FRAPPE_REF=${{ env.FRAPPE_REF }}
            ERPNEXT_REF=${{ env.ERPNEXT_REF }}
            HELPDESK_REF=${{ env.HELPDESK_REF }}
            INSIGHTS_REF=${{ env.INSIGHTS_REF }}
            TELEPHONY_REF=${{ env.TELEPHONY_REF }}
            FRAPPE_UI_REF=${{ env.FRAPPE_UI_REF }}
          cache-from: type=gha,scope=office-staging-integrated
          cache-to: type=gha,mode=max,scope=office-staging-integrated

      - name: Smoke-test app SHAs, assets, exports, and installed Werkzeug
        shell: bash
        run: |
          set -euo pipefail
          local_image="office-staging:$IMAGE_TAG"
          docker run --rm --entrypoint bash "$local_image" -ec '
            root=/home/frappe/frappe-bench
            for app in frappe erpnext helpdesk insights telephony; do test -d "$root/apps/$app"; done
            test -s "$root/assets/assets.json"
            for app in frappe erpnext helpdesk insights; do
              test -d "$root/assets/$app"
              find -L "$root/assets/$app" -type f -size +0c -print -quit | grep -q .
            done
            test -s "$root/candidate-sha-manifest.json"
            "$root/env/bin/python" -c "import importlib.metadata as m; v=m.version(\"Werkzeug\"); print(\"Werkzeug runtime version:\", v); assert v == \"3.1.9\", v"
          '
          docker run --rm --entrypoint cat "$local_image" /home/frappe/frappe-bench/candidate-sha-manifest.json > candidate-sha-manifest.json
          jq -e \
            --arg frappe "$FRAPPE_REF" --arg erpnext "$ERPNEXT_REF" \
            --arg helpdesk "$HELPDESK_REF" --arg insights "$INSIGHTS_REF" \
            --arg telephony "$TELEPHONY_REF" --arg frappe_ui "$FRAPPE_UI_REF" \
            '.frappe == $frappe and .erpnext == $erpnext and .helpdesk == $helpdesk and .insights == $insights and .telephony == $telephony and .frappe_ui == $frappe_ui' \
            candidate-sha-manifest.json >/dev/null
          echo "Image smoke test and six-app SHA manifest: PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Check GHCR package visibility before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/user/packages/container/office-staging-persian)"
          case "$status" in
            200)
              visibility="$(jq -r '.visibility // "unknown"' "$response")"
              test "$visibility" = private || { echo "Existing GHCR package is '$visibility'; refusing to publish." >&2; exit 1; }
              echo "Pre-publish package visibility: private" >> "$GITHUB_STEP_SUMMARY"
              ;;
            404)
              echo "Pre-publish package check: absent. New personal GHCR packages default to private; post-publish visibility will be enforced." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "Package visibility API returned HTTP $status; refusing to publish." >&2
              exit 1
              ;;
          esac
          rm -f "$response"

      - name: Authenticate to GHCR and reject an existing immutable tag
        env:
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          set +e
          inspect_output="$(docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_TAG" 2>&1)"
          inspect_status=$?
          set -e
          if [[ $inspect_status -eq 0 ]]; then
            echo "Immutable candidate tag already exists; refusing to overwrite it." >&2
            exit 1
          fi
          if ! grep -Eqi 'manifest unknown|manifest.*not found|404 Not Found|: not found$' <<< "$inspect_output"; then
            if grep -Eqi '401 Unauthorized|403 Forbidden|denied|unauthorized' <<< "$inspect_output"; then
              classification="registry authorization denied"
            elif grep -Eqi 'timeout|connection reset|network is unreachable' <<< "$inspect_output"; then
              classification="registry network failure"
            else
              classification="unrecognized registry response"
            fi
            echo "Could not prove the immutable tag is absent ($classification); refusing to publish." >&2
            printf '%s' "$inspect_output" | python3 -c 'import os,sys; value=sys.stdin.read(); token=os.environ.get("GHCR_TOKEN", ""); print(value.replace(token, "[REDACTED]")[:1000])' >&2
            exit 1
          fi

      - name: Publish the smoke-tested candidate
        shell: bash
        run: |
          set -euo pipefail
          docker tag "office-staging:$IMAGE_TAG" "$IMAGE_NAME:$IMAGE_TAG"
          docker push "$IMAGE_NAME:$IMAGE_TAG"
          digest="$(docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_TAG" | awk '$1 == "Digest:" { print $2; exit }')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_id="$(docker image inspect "office-staging:$IMAGE_TAG" --format '{{.Id}}')"
          jq --arg image "$IMAGE_NAME" --arg tag "$IMAGE_TAG" --arg digest "$digest" --arg image_id "$image_id" \
            '. + {image: $image, immutable_tag: $tag, registry_digest: $digest, local_image_id: $image_id, published: true}' \
            candidate-sha-manifest.json > published-candidate-manifest.json
          echo "Published image: $IMAGE_NAME@$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce private visibility after publishing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          status="$(curl --silent --show-error --retry 5 --retry-delay 2 --retry-connrefused --output "$response" --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/user/packages/container/office-staging-persian)"
          test "$status" = 200 || { echo "Published package metadata returned HTTP $status." >&2; exit 1; }
          visibility="$(jq -r '.visibility // "unknown"' "$response")"
          test "$visibility" = private || { echo "Published GHCR package is '$visibility', not private." >&2; exit 1; }
          echo "Post-publish package visibility: private" >> "$GITHUB_STEP_SUMMARY"
          rm -f "$response"

      - name: Upload immutable candidate manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: office-staging-private-image-manifest-${{ steps.candidate.outputs.candidate_key }}
          path: published-candidate-manifest.json
          retention-days: 14
