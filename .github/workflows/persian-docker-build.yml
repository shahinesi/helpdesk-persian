name: Persian clean Docker build

run-name: Persian Docker build (${{ github.event.pull_request.head.sha || github.sha }})

on:
  pull_request:
    branches: [develop]
    paths:
      - "desk/**"
      - "helpdesk/**"
      - "pyproject.toml"
      - "docker/HelpdeskPersian.Containerfile"
      - "docker/entrypoint.sh"
      - "docker/start.sh"
      - "docker/frappe-docker-source.ref"
      - "desk/patches/*.ref"
      - ".dockerignore"
      - ".github/workflows/persian-docker-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-docker-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify tested commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          printf 'Tested commit: %s\n' "$actual_sha" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/HelpdeskPersian.Containerfile
          push: false
          tags: helpdesk-persian:candidate
          build-args: |
            HELPDESK_REF=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
