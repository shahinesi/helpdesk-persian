name: Persian clean Docker build

on:
  push:
    branches: [custom/develop-fa]
    paths:
      - "desk/**"
      - "helpdesk/**"
      - "pyproject.toml"
      - "docker/HelpdeskPersian.Containerfile"
      - "docker/entrypoint.sh"
      - "docker/start.sh"
      - "docker/frappe-docker-source.ref"
      - "desk/patches/*.ref"
      - ".dockerignore"
      - ".github/workflows/persian-docker-build.yml"
  pull_request:
    branches: [custom/develop-fa]
    paths:
      - "desk/**"
      - "helpdesk/**"
      - "pyproject.toml"
      - "docker/HelpdeskPersian.Containerfile"
      - "docker/entrypoint.sh"
      - "docker/start.sh"
      - "docker/frappe-docker-source.ref"
      - "desk/patches/*.ref"
      - ".dockerignore"
      - ".github/workflows/persian-docker-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/HelpdeskPersian.Containerfile
          push: false
          tags: helpdesk-persian:candidate
          build-args: |
            HELPDESK_REF=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
