name: UI Tests

on:
  push:
    branches:
      - custom/develop-fa
    paths:
      - "desk/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "yarn.lock"
      - "pyproject.toml"
      - ".github/helpers/**"
      - ".github/bench-version.ref"
      - "desk/patches/*.ref"
      - ".github/workflows/ui-tests.yml"
  pull_request:
    branches:
      - develop
      - custom/develop-fa
    paths:
      - "desk/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "yarn.lock"
      - "pyproject.toml"
      - ".github/helpers/**"
      - ".github/bench-version.ref"
      - "desk/patches/*.ref"
      - ".github/workflows/ui-tests.yml"
  workflow_dispatch:

concurrency:
  group: ui-tests-helpdesk-${{ github.event.number || github.ref }}
  cancel-in-progress: true

env:
  FRAPPE_BRANCH: develop
  SITE: helpdesk.test

jobs:
  ui-tests:
    name: Playwright E2E Tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      redis-cache:
        image: public.ecr.aws/docker/library/redis:8.4-alpine@sha256:0514fa59e3d84e2f3be66731c5401fc2a85b8ea71b49c0116c850f6a558076f4
        ports:
          - 13000:6379
      redis-queue:
        image: public.ecr.aws/docker/library/redis:8.4-alpine@sha256:0514fa59e3d84e2f3be66731c5401fc2a85b8ea71b49c0116c850f6a558076f4
        ports:
          - 11000:6379
      mariadb:
        image: public.ecr.aws/docker/library/mariadb:10.6@sha256:23616f0bd3aff922f4dea4130f1d0a09f3571d20b7b36c8f49840672dc309e8c
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot --silent" --health-interval=5s --health-timeout=2s --health-retries=12

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-ui-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-ui-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('yarn.lock') }}

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt install -y mariadb-client

      - name: Setup Bench
        run: |
          bench_version="$(tr -d '[:space:]' < .github/bench-version.ref)"
          pip install "frappe-bench==${bench_version}"
          bench init --skip-redis-config-generation --skip-assets --frappe-branch "$FRAPPE_BRANCH" --python "$(which python)" ~/frappe-bench
          frappe_ui_ref="$(tr -d '[:space:]' < desk/patches/frappe-ui-source.ref)"
          git -C ~/frappe-bench/apps/frappe fetch --depth 1 https://github.com/frappe/frappe.git "$frappe_ui_ref"
          git -C ~/frappe-bench/apps/frappe checkout --detach "$frappe_ui_ref"
          test "$(git -C ~/frappe-bench/apps/frappe rev-parse HEAD)" = "$frappe_ui_ref"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install Helpdesk
        working-directory: /home/runner/frappe-bench
        run: |
          bash "$GITHUB_WORKSPACE/.github/helpers/get-app-at-ref.sh" telephony https://github.com/frappe/telephony "$GITHUB_WORKSPACE/desk/patches/telephony-source.ref"
          bench get-app helpdesk $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin --install-app helpdesk $SITE
          bench use $SITE
          bench --site $SITE set-config host_name "http://localhost:8000"
          bench build --apps frappe,helpdesk
        env:
          CI: "Yes"

      - name: Start Frappe Server
        working-directory: /home/runner/frappe-bench
        run: |
          sed -i 's/^watch:/# watch:/g' Procfile
          sed -i 's/^schedule:/# schedule:/g' Procfile
          bench start &> bench_start.log &
          timeout 120 bash -c "until curl -s http://localhost:8000 > /dev/null; do sleep 2; done"

      - name: Install Playwright
        run: |
          yarn install --frozen-lockfile --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: npx playwright test --shard=${{ matrix.shard }}/2
        env:
          # localhost is a secure context, which crypto.randomUUID in frappe/ui needs.
          BASE_URL: http://localhost:8000
          ADMIN_PASSWORD: admin

      - name: Upload Blob Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

      - name: Show Bench Logs on Failure
        if: failure()
        working-directory: /home/runner/frappe-bench
        run: |
          cat bench_start.log || true
          cat logs/*.log || true

  merge-reports:
    name: Merge Playwright Reports
    needs: ui-tests
    if: always() && needs.ui-tests.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      - name: Install Playwright
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Download Blob Reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge Into HTML Report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
