name: Lint

on:
  pull_request:
    branches:
      - main
      - main-hotfix
      - develop

jobs:
  commit-lint:
    name: Semantic Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 200
      - uses: actions/setup-node@v3
        with:
          node-version: 24
          check-latest: true
      - name: Check commit titles
        run: |
          npm install @commitlint/cli @commitlint/config-conventional
          npx commitlint --verbose --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  linter:
    name: 'Frappe Linter'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v2

      - name: Check Persian translation coverage
        run: python scripts/check_fa_translation.py

      - name: Verify compiled Persian catalog
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
          msgfmt --check -o /tmp/helpdesk-fa.mo helpdesk/locale/fa.po
          python scripts/check_fa_translation.py --mo /tmp/helpdesk-fa.mo
          python scripts/check_fa_translation.py --mo helpdesk/locale/fa/LC_MESSAGES/helpdesk.mo

      - name: Set up Python 3.10
        uses: actions/setup-python@v2
        with:
          python-version: '3.14'

      - name: Install and Run Pre-commit
        uses: pre-commit/action@v3.0.1

      - name: Download Semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Download semgrep
        run: pip install semgrep

      - name: Run Semgrep rules
        run: semgrep ci --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness
