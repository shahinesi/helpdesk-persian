name: Lint

on:
  push:
    branches:
      - custom/develop-fa
    paths:
      - 'desk/**'
      - 'helpdesk/**'
      - 'pyproject.toml'
      - '**.po'
      - 'scripts/check_fa_translation.py'
      - '.github/workflows/lint.yml'
  pull_request:
    branches:
      - main
      - main-hotfix
      - develop
      - custom/develop-fa
  workflow_dispatch:

jobs:
  commit-lint:
    name: Semantic Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 200
      - uses: actions/setup-node@v3
        with:
          node-version: 24
          check-latest: true
      - name: Check commit titles
        run: |
          npm install @commitlint/cli @commitlint/config-conventional
          npx commitlint --verbose --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  linter:
    name: 'Frappe Linter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Persian translation coverage
        run: python scripts/check_fa_translation.py

      - name: Verify compiled Persian catalog
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
          msgfmt --check -o /tmp/helpdesk-fa.mo helpdesk/locale/fa.po
          python scripts/check_fa_translation.py --mo /tmp/helpdesk-fa.mo

      - name: Set up Python 3.14
        uses: actions/setup-python@v2
        with:
          python-version: '3.14'

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run Pre-commit on changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mapfile -t changed_files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA")
          if (( ${#changed_files[@]} )); then
            pre-commit run --files "${changed_files[@]}"
          fi

      - name: Download Semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Download semgrep
        run: pip install semgrep

      - name: Run Semgrep rules
        env:
          SEMGREP_BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: semgrep ci --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness
