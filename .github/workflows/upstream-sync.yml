name: Safe develop upstream sync

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: upstream-develop-sync
  cancel-in-progress: false

jobs:
  sync-and-propose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward the official develop mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/frappe/helpdesk.git
          git fetch --no-tags upstream refs/heads/develop:refs/remotes/upstream/develop

          upstream_sha="$(git rev-parse refs/remotes/upstream/develop)"
          vendor_sha="$(git ls-remote origin refs/heads/vendor/develop | cut -f1)"
          if [[ -z "$vendor_sha" ]]; then
            echo "vendor/develop is missing; refusing to create a mirror implicitly." >&2
            exit 1
          fi

          if git merge-base --is-ancestor "$vendor_sha" "$upstream_sha"; then
            if [[ "$vendor_sha" != "$upstream_sha" ]]; then
              git push origin "$upstream_sha:refs/heads/vendor/develop"
            fi
          elif git merge-base --is-ancestor "$upstream_sha" "$vendor_sha"; then
            echo "vendor/develop is ahead of upstream; refusing to move it backwards." >&2
            exit 1
          else
            echo "vendor/develop and upstream/develop have diverged; manual review required." >&2
            exit 1
          fi

      - name: Prepare the Persian develop proposal
        id: proposal
        run: |
          set -euo pipefail
          git fetch origin \
            refs/heads/custom/develop-fa:refs/remotes/origin/custom/develop-fa \
            refs/heads/vendor/develop:refs/remotes/origin/vendor/develop
          base="refs/remotes/origin/custom/develop-fa"
          upstream="refs/remotes/origin/vendor/develop"
          proposal_branch="sync/upstream-develop-fa"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git merge-base --is-ancestor "$upstream" "$base"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "$proposal_branch" >/dev/null 2>&1; then
            git fetch origin "refs/heads/$proposal_branch:refs/remotes/origin/$proposal_branch"
            git switch --create "$proposal_branch" --track "refs/remotes/origin/$proposal_branch"
            original_proposal_sha="$(git rev-parse HEAD)"
          else
            git switch --create "$proposal_branch" "$base"
            original_proposal_sha=""
          fi

          if ! git merge-base --is-ancestor "$base" HEAD; then
            if ! git merge --no-edit --no-ff "$base"; then
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [[ -n "$conflicts" ]]; then
                printf "### Conflict merging Persian base\n\n\`\`\`text\n%s\n\`\`\`\n" "$conflicts" >> "$GITHUB_STEP_SUMMARY"
              fi
              exit 1
            fi
          fi

          if ! git merge-base --is-ancestor "$upstream" HEAD; then
            if ! git merge --no-edit --no-ff "$upstream"; then
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [[ -n "$conflicts" ]]; then
                printf "### Conflict merging official develop\n\n\`\`\`text\n%s\n\`\`\`\n" "$conflicts" >> "$GITHUB_STEP_SUMMARY"
              fi
              exit 1
            fi
          fi

          proposal_sha="$(git rev-parse HEAD)"
          if [[ -n "$original_proposal_sha" && "$proposal_sha" == "$original_proposal_sha" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push --set-upstream origin "$proposal_branch"

          merge_base="$(git merge-base "$base" "$upstream")"
          git diff --name-only "$merge_base..$upstream" > "$RUNNER_TEMP/upstream-files.txt"
          git diff --stat "$merge_base..$upstream" > "$RUNNER_TEMP/upstream-stat.txt"
          {
            echo "changed=true"
            echo "base_sha=$(git rev-parse "$base")"
            echo "upstream_sha=$(git rev-parse "$upstream")"
            echo "proposal_sha=$proposal_sha"
            echo "changed_files=$(wc -l < "$RUNNER_TEMP/upstream-files.txt" | tr -d ' ')"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update a draft proposal PR
        if: steps.proposal.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.proposal.outputs.base_sha }}
          UPSTREAM_SHA: ${{ steps.proposal.outputs.upstream_sha }}
          PROPOSAL_SHA: ${{ steps.proposal.outputs.proposal_sha }}
          CHANGED_FILES: ${{ steps.proposal.outputs.changed_files }}
        run: |
          set -euo pipefail
          {
            printf '%s\n\n' '## Upstream develop update proposal'
            printf -- "- Persian base: \`%s\`\n" "$BASE_SHA"
            printf -- "- Official develop: \`%s\`\n" "$UPSTREAM_SHA"
            printf -- "- Candidate merge: \`%s\`\n" "$PROPOSAL_SHA"
            printf -- '- Upstream files changed: %s\n' "$CHANGED_FILES"
            printf '%s\n' '- Conflict policy: conflicts stop the workflow; no conflict is auto-resolved.'
            printf '%s\n\n' '- Merge/deploy policy: manual review required; neither is automated.'
            printf '%s\n\n' '### Upstream diff summary'
            cat "$RUNNER_TEMP/upstream-stat.txt"
            printf '%s\n\n' '### Changed upstream paths'
            while IFS= read -r path; do
              printf -- "- \`%s\`\n" "$path"
            done < "$RUNNER_TEMP/upstream-files.txt"
            printf '%s\n' 'Review dependency and migration changes, translated strings, RTL behavior, Jalali behavior, and pinned Frappe 17 compatibility. GitHub does not trigger pull_request workflows from a GITHUB_TOKEN-created PR; this workflow dispatches the validation workflows explicitly. No merge or deployment is automatic.'
          } > "$RUNNER_TEMP/upstream-proposal.md"

          existing="$(gh pr list --state open --base custom/develop-fa --head "${GITHUB_REPOSITORY_OWNER}:sync/upstream-develop-fa" --json url --jq '.[0].url // empty')"
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --title "chore(upstream): propose develop update" --body-file "$RUNNER_TEMP/upstream-proposal.md"
          else
            gh pr create --draft --base custom/develop-fa --head sync/upstream-develop-fa \
              --title "chore(upstream): propose develop update" \
              --body-file "$RUNNER_TEMP/upstream-proposal.md"
          fi

      - name: Dispatch validation workflows for the proposal
        if: steps.proposal.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.proposal.outputs.base_sha }}
        run: |
          set -euo pipefail
          gh workflow run lint.yml --ref sync/upstream-develop-fa \
            --field baseline_ref="$BASE_SHA"
          for workflow in server-tests.yml ui-tests.yml persian-clean-build.yml persian-docker-build.yml; do
            gh workflow run "$workflow" --ref sync/upstream-develop-fa
          done
